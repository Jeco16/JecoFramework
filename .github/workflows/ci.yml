# CI workflow
name: CI

on:
  push:
    branches: [ main, master ]
    tags: ['v*']
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selftest:
    name: Framework self-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run install:browsers

      - name: Run framework self-tests
        run: npm run selftest
        env:
          CI: true

      - name: Upload selftest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-report
          path: report

  test:
    name: Lint and Test
    needs: selftest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run install:browsers

      - name: Run lint
        run: npm run lint:fix

      - name: Run smoke tests
        run: npm run test -- --grep "@smoke"
        env:
          CI: true
          HEADLESS: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Upload artifacts folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts